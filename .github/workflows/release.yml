name: Release

# A version tag builds, notarizes and publishes MacDNS.dmg as a GitHub release,
# then opens a pull request that points appcast.xml at it. Installed apps read
# the feed from main, so nothing reaches them until that pull request merges.
# The CI workflow runs `make ci` on the tagged commit when it reaches main, so
# this job builds while CI runs and publishes only after CI passes.
# The pull request is a separate job, so "Re-run failed jobs" retries it with
# the appcast of this build instead of building and publishing again.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag matches helper.mk
        run: |
          version=$(awk '$1 == "VERSION" && $2 == "=" { print $3; exit }' helper.mk)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match VERSION = $version in helper.mk"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # No cache in this job, so a cache entry written by another run can never
      # end up inside a signed release.
      - uses: ./.github/actions/setup-toolchain

      - name: Build, notarize and sign the release
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.APP_PROFILE_BASE64 }}
          EXTENSION_PROFILE_BASE64: ${{ secrets.EXTENSION_PROFILE_BASE64 }}
          CONTENT_FILTER_PROFILE_BASE64: ${{ secrets.CONTENT_FILTER_PROFILE_BASE64 }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          KEYGEN_TRIAL_TOKEN: ${{ secrets.KEYGEN_TRIAL_TOKEN }}
        run: make release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appcast
          path: build/appcast.xml
          if-no-files-found: error

      - name: Wait for CI to pass on this commit
        run: |
          set -euo pipefail
          run_id=""
          for _ in $(seq 1 30); do
            run_id=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 20
          done
          if [ -z "$run_id" ]; then
            echo "::error::No CI run for $GITHUB_SHA. Push the commit to main before tagging it."
            exit 1
          fi
          gh run watch "$run_id" --exit-status --interval 30 >/dev/null || {
            echo "::error::CI run $run_id failed for $GITHUB_SHA. Fix it, then re-run this job."
            exit 1
          }

      - name: Write the release notes
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: Scripts/release-notes.sh "$TAG" release-notes.md

      - name: Publish the release
        run: |
          if [ -s release-notes.md ]; then
            notes=(--notes-file release-notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$TAG" build/MacDNS.dmg --verify-tag --title "MacDNS $TAG" "${notes[@]}"

  appcast:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appcast
          path: ${{ runner.temp }}/appcast

      # A re-run replaces the branch and reuses an open pull request.
      - name: Open the appcast pull request
        run: |
          set -euo pipefail
          branch="release/appcast-$TAG"
          git switch --create "$branch"
          cp "$RUNNER_TEMP/appcast/appcast.xml" appcast.xml
          git add appcast.xml
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --file - <<EOF
          chore(release): publish $TAG in the update feed

          Points appcast.xml at the notarized MacDNS.dmg of the $TAG release.
          Installed apps offer the update once this reaches main.
          EOF
          gh auth setup-git
          git push --force origin "$branch"
          if [ "$(gh pr list --head "$branch" --state open --json number --jq length)" = 0 ]; then
            gh pr create --base main --head "$branch" \
              --title "chore(release): publish $TAG in the update feed" \
              --body "Points appcast.xml at the MacDNS.dmg of the [$TAG release](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG). Installed apps read the feed from main, so merging this pull request offers the update to every user. Install the DMG from the release and check it before merging."
          fi
