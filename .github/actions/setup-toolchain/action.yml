name: Set up the MacDNS toolchain
description: Rust with both macOS targets and the tools `make ci` needs (reuse, cargo-about, cargo-audit).

inputs:
  swiftpm-cache:
    description: Restore and save the SwiftPM cache. The release job leaves it off.
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Rust
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal \
          --component clippy,rustfmt \
          --target x86_64-apple-darwin,aarch64-apple-darwin
        rustup default stable

    - name: Install lint and audit tools
      shell: bash
      env:
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
      run: brew install reuse cargo-about cargo-audit

    - name: Show versions
      shell: bash
      run: |
        xcodebuild -version
        swift --version
        rustc --version
        reuse --version | head -n 1
        cargo about --version
        cargo audit --version

    # Besides downloads it holds parsed manifests and prebuilt binaries, so it
    # never feeds a signed release.
    - if: inputs.swiftpm-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/org.swift.swiftpm
        key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}
        restore-keys: swiftpm-${{ runner.os }}-${{ runner.arch }}-
