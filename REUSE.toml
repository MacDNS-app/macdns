version = 1

# Swift and Rust sources carry the SPDX header in the file. Everything else
# (scripts, build files, docs, config, data and images) is declared here.
[[annotations]]
path = [
    "Scripts/**",
    "**/Makefile",
    "**/*.mk",
    "**/*.md",
    "**/*.toml",
    "**/.gitignore",
    ".env.example",
    ".swift-format",
    "Package.resolved",
    "rust-resolver/Cargo.lock",
    "rust-resolver/*.hbs",
    "Tests/Fixtures/**",
    "**/*.plist",
    "**/*.entitlements",
    "Icons/**",
    "docs/images/**",
    ".github/**",
    "appcast.xml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025-2026 Marcus Grando"
SPDX-License-Identifier = "LicenseRef-FCL-1.0-ALv2"

# Hickory DNS 0.26.3, vendored with local changes. Each changed file carries
# its own notice, and rust-resolver/vendor/README.md lists the changes.
[[annotations]]
path = [
    "rust-resolver/vendor/hickory-net/**",
    "rust-resolver/vendor/hickory-resolver/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = [
    "2015 The Hickory DNS Developers",
    "2017 Google LLC.",
]
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Generated by `make third-party-licenses`. It reproduces the license texts of
# the bundled dependencies verbatim, so the tags inside it are not parsed.
[[annotations]]
path = "THIRD_PARTY_LICENSES.txt"
precedence = "override"
SPDX-FileCopyrightText = "2025-2026 Marcus Grando"
SPDX-License-Identifier = "LicenseRef-FCL-1.0-ALv2"
